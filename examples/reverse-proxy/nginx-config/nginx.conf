# =============================================================================
# Nginx Reverse Proxy — Production Configuration
# =============================================================================
# Features:
#   - Reverse proxy to Node.js upstream (load-balanced across instances)
#   - SSL/TLS termination with modern cipher suite
#   - Rate limiting (per-IP request throttling)
#   - Gzip compression for text-based responses
#   - Static file serving with cache headers
#   - Security headers (HSTS, X-Frame-Options, etc.)
#   - WebSocket support
#   - Health check endpoint
#
# Usage:
#   docker compose up                    — Start nginx + 2 app instances
#   nginx -t                             — Test config syntax
#   nginx -s reload                      — Reload config without downtime
#
# File structure:
#   /etc/nginx/nginx.conf               — This file (main config)
#   /etc/nginx/ssl/                     — SSL certificates (see comments below)
#   /usr/share/nginx/html/static/       — Static files served directly by nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Main context — global settings
# ---------------------------------------------------------------------------

# Run as many worker processes as CPU cores.
# "auto" detects the number of CPU cores available.
# Each worker handles thousands of connections via epoll/kqueue.
worker_processes auto;

# Maximum number of open files per worker.
# Each connection uses one file descriptor. Set this higher than
# worker_connections to avoid "too many open files" errors.
worker_rlimit_nofile 8192;

# Error log. "warn" level is good for production — captures real problems
# without the noise of "info" or "debug".
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ---------------------------------------------------------------------------
# Events — connection handling
# ---------------------------------------------------------------------------
events {
    # Maximum simultaneous connections per worker process.
    # Total capacity = worker_processes x worker_connections.
    # 4096 per worker is generous for most apps.
    worker_connections 4096;

    # epoll is the most efficient connection processing method on Linux.
    # kqueue on macOS/BSD. Nginx auto-selects, but being explicit is clearer.
    use epoll;

    # Accept as many connections as possible at once.
    # Improves performance under heavy load at the cost of slightly uneven
    # load distribution across workers.
    multi_accept on;
}

# ---------------------------------------------------------------------------
# HTTP context — all HTTP/HTTPS configuration
# ---------------------------------------------------------------------------
http {
    # Include MIME type mappings (text/html, application/json, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging format
    # -----------------------------------------------------------------------
    # Custom log format with response time, upstream address, and request ID.
    # $request_time is the total time from first byte received to last byte sent.
    # $upstream_response_time is how long the Node.js app took to respond.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------------------------------
    # Performance tuning
    # -----------------------------------------------------------------------

    # sendfile: bypass user-space buffer copying for static files.
    # Files go directly from disk to network via kernel, saving CPU cycles.
    sendfile on;

    # tcp_nopush: send headers and beginning of file in one packet.
    # Reduces the number of packets sent (works with sendfile).
    tcp_nopush on;

    # tcp_nodelay: disable Nagle's algorithm for keep-alive connections.
    # Sends small packets immediately instead of waiting to batch them.
    # Important for real-time apps and APIs where latency matters.
    tcp_nodelay on;

    # Keep-alive timeout: how long to keep idle connections open.
    # 65 seconds is slightly longer than most client timeouts (60s).
    keepalive_timeout 65;

    # Maximum size of a client request body (e.g., file uploads).
    # Set higher if your app accepts large file uploads.
    # 413 error if exceeded.
    client_max_body_size 10m;

    # Hide nginx version from response headers and error pages.
    # Prevents attackers from targeting known nginx vulnerabilities.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Rate limiting
    # -----------------------------------------------------------------------
    # limit_req_zone defines a shared memory zone for tracking request rates.
    # $binary_remote_addr uses the client IP (in binary, 4 bytes for IPv4)
    # as the key — each IP gets its own counter.
    #
    # zone=api_limit:10m — 10MB of shared memory (~160,000 IPv4 addresses).
    # rate=30r/s — allow 30 requests per second per IP.
    #
    # This zone is referenced in server blocks with limit_req.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Stricter zone for authentication endpoints to prevent brute-force.
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=5r/s;

    # Custom error page for rate-limited requests (429 Too Many Requests).
    # Without this, nginx returns 503 by default for rate-limited requests.
    limit_req_status 429;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    # Compresses responses before sending them to the client.
    # Typically reduces text-based response sizes by 60-80%.
    # CPU cost is minimal compared to bandwidth savings.

    gzip on;

    # Minimum response size to compress. Don't compress tiny responses —
    # the gzip overhead makes them larger, not smaller.
    gzip_min_length 256;

    # Compress responses for proxied requests too (not just direct clients).
    # "any" means compress regardless of the request's proxy headers.
    gzip_proxied any;

    # Compression level: 1 (fastest, least compression) to 9 (slowest, best).
    # Level 6 is a good balance. Levels 7-9 use significantly more CPU
    # with diminishing returns on compression ratio.
    gzip_comp_level 6;

    # MIME types to compress. Text-based formats compress well.
    # Don't compress images (already compressed) or binary formats.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Add "Vary: Accept-Encoding" header so caches store both compressed
    # and uncompressed versions. Without this, a cache might serve a
    # gzipped response to a client that doesn't support gzip.
    gzip_vary on;

    # -----------------------------------------------------------------------
    # Upstream — load-balanced Node.js instances
    # -----------------------------------------------------------------------
    # Defines the backend servers nginx proxies to. Requests are distributed
    # across these servers using round-robin by default.
    #
    # The server names (app1, app2) match the Docker Compose service names.
    # Docker's internal DNS resolves them to container IPs.
    upstream node_backend {
        # Keep persistent connections to the backend.
        # Avoids the overhead of establishing a new TCP connection for
        # every proxied request. 32 connections are kept open per worker.
        keepalive 32;

        server app1:3000;
        server app2:3000;

        # Alternative load balancing methods:
        # least_conn;          — Route to the server with fewest active connections
        # ip_hash;             — Same client IP always goes to same server (sticky)
        # hash $request_uri;   — Same URL always goes to same server (cache-friendly)
    }

    # -----------------------------------------------------------------------
    # HTTP server — redirect to HTTPS
    # -----------------------------------------------------------------------
    # In production, all HTTP traffic should redirect to HTTPS.
    # Uncomment this block when you have SSL certificates.
    #
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name example.com www.example.com;
    #
    #     # Permanent redirect (301) to HTTPS.
    #     # $host preserves the hostname, $request_uri preserves the path+query.
    #     return 301 https://$host$request_uri;
    # }

    # -----------------------------------------------------------------------
    # HTTPS server — main configuration
    # -----------------------------------------------------------------------
    # For local development without SSL, this listens on port 80.
    # In production, switch to port 443 with SSL (see commented sections).
    server {
        # --- Port binding ---
        # Development: listen on port 80 (HTTP)
        listen 80;
        listen [::]:80;

        # Production: uncomment these and comment out the port 80 lines above.
        # listen 443 ssl http2;
        # listen [::]:443 ssl http2;

        server_name localhost;
        # Production: server_name example.com www.example.com;

        # -------------------------------------------------------------------
        # SSL/TLS configuration (uncomment for production)
        # -------------------------------------------------------------------
        # Obtain certificates from Let's Encrypt (free) or your CA.
        # Place them in /etc/nginx/ssl/ and uncomment these lines.
        #
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        #
        # --- TLS protocol versions ---
        # Only allow TLS 1.2 and 1.3. Older versions have known
        # vulnerabilities (POODLE, BEAST, etc.).
        # ssl_protocols TLSv1.2 TLSv1.3;
        #
        # --- Cipher suites ---
        # Prefer server's cipher order so we control which ciphers are used.
        # This list prioritizes AEAD ciphers (AES-GCM, ChaCha20) which are
        # fast and resistant to padding oracle attacks.
        # ssl_prefer_server_ciphers on;
        # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        #
        # --- SSL session caching ---
        # Reduces the CPU cost of repeated TLS handshakes from the same client.
        # 10MB of shared cache holds ~40,000 sessions.
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;
        # ssl_session_tickets off;
        #
        # --- OCSP stapling ---
        # Instead of clients checking certificate revocation with the CA,
        # nginx fetches and caches the OCSP response and sends it during
        # the TLS handshake. Faster for clients, more private.
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        # resolver 1.1.1.1 8.8.8.8 valid=300s;

        # -------------------------------------------------------------------
        # Security headers
        # -------------------------------------------------------------------
        # HSTS: tell browsers to always use HTTPS for this domain.
        # max-age=31536000 = 1 year. includeSubDomains covers all subdomains.
        # Only enable after confirming HTTPS works perfectly.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent clickjacking by disallowing this site from being embedded
        # in an iframe on another domain.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME type sniffing. Browser respects Content-Type header
        # instead of guessing — prevents XSS via disguised content types.
        add_header X-Content-Type-Options "nosniff" always;

        # -------------------------------------------------------------------
        # Rate limiting — applied to API routes
        # -------------------------------------------------------------------
        # Apply the api_limit zone defined above.
        # burst=20 allows 20 requests to queue above the rate limit before
        # rejecting. nodelay processes queued requests immediately instead
        # of spacing them out (better UX, trades burst protection for speed).
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://node_backend;
            include /etc/nginx/proxy_params_common;
        }

        # Stricter rate limit for authentication endpoints.
        # 5 req/s with a small burst — prevents brute-force attacks.
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://node_backend;
            include /etc/nginx/proxy_params_common;
        }

        # -------------------------------------------------------------------
        # Static files — served directly by nginx
        # -------------------------------------------------------------------
        # Nginx serves static files much faster than Node.js (zero overhead).
        # Put your built frontend, images, etc. in /usr/share/nginx/html/static/.
        location /static/ {
            alias /usr/share/nginx/html/static/;

            # Cache static assets aggressively. Users get fresh content by
            # using cache-busting filenames (style.abc123.css).
            expires 30d;
            add_header Cache-Control "public, immutable";

            # Don't log static file requests — they'd flood access logs.
            access_log off;
        }

        # -------------------------------------------------------------------
        # WebSocket support
        # -------------------------------------------------------------------
        # WebSocket connections start as HTTP and then "upgrade" to WS.
        # Nginx needs explicit configuration to pass the upgrade headers.
        location /ws/ {
            proxy_pass http://node_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket connections are long-lived. Default proxy timeout
            # is 60s — increase it so idle connections aren't dropped.
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------------
        # Health check — nginx itself
        # -------------------------------------------------------------------
        # Returns 200 if nginx is running. Used by Docker HEALTHCHECK
        # and load balancers to verify the proxy layer is alive.
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # -------------------------------------------------------------------
        # Default location — proxy to Node.js
        # -------------------------------------------------------------------
        # All requests not matched by the locations above go to Node.js.
        location / {
            proxy_pass http://node_backend;
            include /etc/nginx/proxy_params_common;
        }
    }
}
