services:
  app:
    build: .
    ports:
      - "3000:3000"
    develop:
      watch:
        # Sync: static assets update instantly, no restart needed
        - action: sync
          path: ./public
          target: /app/public

        # Sync + Restart: config changes need server restart to take effect
        - action: sync+restart
          path: ./config.json
          target: /app/config.json

        # Rebuild: dependency or Dockerfile changes trigger full rebuild
        - action: rebuild
          path: ./package.json
